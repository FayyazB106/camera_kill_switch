name: Build Release

# Push a version tag (e.g. v1.0.0) to build the installer and attach it to a
# draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Build-Installer.ps1 builds the icon + app exe (via Build-App.ps1) and then
      # compiles dist/CameraKillSwitch-Setup.exe with Inno Setup.
      - name: Build installer
        shell: powershell
        run: .\windows\installer\Build-Installer.ps1

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Camera Kill Switch ${{ github.ref_name }}"
          files: dist/CameraKillSwitch-Setup.exe
